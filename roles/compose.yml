services:
  wrenidm:
    image: ${WRENIDM_IMAGE:-wrensecurity/wrenidm:7.2.0}
    container_name: wrenidm
    environment:
      JAVA_OPTS: "-Dfelix.fileinstall.disableConfigSave=false"
    depends_on:
      ldap:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./conf/provisioner.openicf-ldap.json:/opt/wrenidm/conf/provisioner.openicf-ldap.json
      - ./conf/sync.json:/opt/wrenidm/conf/sync.json
  ldap:
    image: wrensecurity/wrends:5.1.1
    container_name: ldap
    ports:
      - "1389:1389"
      - "1636:1636"
    environment:
      BASE_DN: "dc=wrensecurity,dc=org"
      ROOT_USER_PASSWORD: "admin"
    healthcheck:
      test: ["CMD-SHELL", "grep -q start-ds /proc/1/cmdline && /opt/wrends/bin/ldapsearch -h localhost -p 1389 -D 'cn=Directory Manager' -w admin -b dc=wrensecurity,dc=org -s base '(objectClass=*)' 1.1"]
      interval: 5s
      timeout: 10s
      retries: 30
    volumes:
      - ./docker/ldap/00-init.ldif:/opt/wrends/bootstrap/init/00-init.ldif
