services:
  wrenidm:
    image: ${WRENIDM_IMAGE:-wrensecurity/wrenidm:7.2.0}
    container_name: wrenidm
    environment:
      JAVA_OPTS: "-Dfelix.fileinstall.disableConfigSave=false"
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./conf/endpoint-greeting.json:/opt/wrenidm/conf/endpoint-greeting.json
      - ./script/handle-greeting.js:/opt/wrenidm/script/handle-greeting.js
